[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-rl"
version = "0.1.0"
description = "JEV Reinforcement Learning: classic games trained with JEV-powered rewards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
classic = ["gymnasium[classic-control,toy-text]>=1.2,<2", "stable-baselines3>=2.7,<3", "torch>=2.5,<3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
jev-arcade = "jev_reward.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "playwright>=1.49,<2",
    "matplotlib>=3.8,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_reward"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
